<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Music">
<meta name="theme-color" content="#0f0f12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Offline Music</title>
<style>
  :root {
    --bg: #0f0f12; --panel: #18181d; --panel2: #202027; --line: #24242b; --hover: #26262e;
    --text: #ececf1; --dim: #8b8b98; --accent: #ff3b5c; --ok: #3ccf8e; --err: #ff6b6b;
    --st: env(safe-area-inset-top); --sb: env(safe-area-inset-bottom);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overscroll-behavior: none; }
  body { font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; height: 100dvh; max-width: 820px; margin: 0 auto; }
  button { font: inherit; color: inherit; background: var(--panel2); border: 0; border-radius: 10px;
           padding: 9px 14px; cursor: pointer; }
  button:active { opacity: .7; }
  button.primary { background: var(--accent); color: #fff; font-weight: 600; }
  button.ghost { background: none; color: var(--dim); }
  button:disabled { opacity: .4; }
  input[type=text], input[type=search] {
    font-size: 16px; width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 10px 12px; outline: none; }
  input:focus { border-color: var(--accent); }

  header.top { padding: calc(var(--st) + 12px) 18px 8px; display: flex; align-items: center; gap: 10px; }
  header.top h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; flex: 1; }
  .chip { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--panel2); color: var(--dim); white-space: nowrap; }
  .chip.on { color: var(--ok); }

  #view { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 14px 16px; }
  .bar { display: flex; gap: 8px; align-items: center; margin: 6px 0 10px; }
  .bar select { font-size: 14px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 9px 8px; }
  .meta { color: var(--dim); font-size: 13px; margin: 0 2px 6px; }
  .note { background: var(--panel); border-radius: 12px; padding: 12px 14px; color: var(--dim); margin: 8px 0; }
  .note b { color: var(--text); }
  .warn { background: #3a2a10; color: #ffcf7a; }

  .list { display: flex; flex-direction: column; }
  .song { display: flex; align-items: center; gap: 12px; padding: 7px 4px; border-radius: 10px; cursor: pointer; }
  .song:active, .song:hover { background: var(--panel); }
  .song.playing .t { color: var(--accent); }
  .song.unavailable { opacity: .35; }
  .art { width: 46px; height: 46px; border-radius: 7px; object-fit: cover; background: var(--panel2); flex: none; }
  .song .txt { flex: 1; min-width: 0; }
  .t, .s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s { color: var(--dim); font-size: 13px; }
  .more { background: none; color: var(--dim); font-size: 20px; padding: 6px 8px; flex: none; line-height: 1; }
  .check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--dim); flex: none; display: grid; place-items: center; font-size: 14px; }
  .check.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .pl { display: flex; align-items: center; gap: 12px; padding: 8px 4px; border-radius: 10px; cursor: pointer; }
  .pl:active, .pl:hover { background: var(--panel); }
  .pl .art { width: 58px; height: 58px; display: grid; place-items: center; font-size: 24px; color: var(--dim); }
  .pl.new .art { color: var(--accent); }
  .phead { display: flex; gap: 16px; align-items: flex-end; margin: 6px 0 14px; }
  .phead .art { width: 120px; height: 120px; border-radius: 12px; font-size: 44px; display: grid; place-items: center; color: var(--dim); }
  .phead h2 { margin: 0 0 4px; font-size: 22px; word-break: break-word; }
  .back { background: none; color: var(--accent); padding: 6px 0; }

  .job { background: var(--panel); border-radius: 12px; padding: 10px 12px; margin: 6px 0; }
  .prog { height: 3px; background: var(--panel2); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .row { display: flex; gap: 8px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .switch { position: relative; width: 50px; height: 30px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--panel2); border-radius: 99px; transition: .2s; }
  .switch span::before { content: ""; position: absolute; width: 26px; height: 26px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + span { background: var(--ok); }
  .switch input:checked + span::before { transform: translateX(20px); }
  ol.steps { padding-left: 20px; margin: 8px 0; } ol.steps li { margin: 8px 0; }
  code { background: var(--panel2); padding: 1px 5px; border-radius: 5px; font-size: 13px; word-break: break-all; }
  .cmd { display: flex; gap: 6px; align-items: flex-start; margin: 6px 0; }
  .cmd code { flex: 1; display: block; padding: 8px 10px; color: var(--text); user-select: all; -webkit-user-select: all; }
  .cmd button { padding: 7px 10px; font-size: 13px; flex: none; }
  h3 { margin: 18px 2px 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }

  #mini { display: none; align-items: center; gap: 10px; margin: 0 8px; padding: 7px 8px; background: var(--panel2); border-radius: 12px; cursor: pointer; position: relative; overflow: hidden; }
  #mini.show { display: flex; }
  #mini .art { width: 40px; height: 40px; }
  #mini .txt { flex: 1; min-width: 0; }
  #mini button { background: none; font-size: 22px; padding: 4px 8px; }
  #mini .line { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); }

  nav.tabs { display: flex; padding: 6px 0 calc(var(--sb) + 6px); border-top: 1px solid var(--line); margin-top: 8px; background: var(--bg); }
  nav.tabs button { flex: 1; background: none; color: var(--dim); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; }
  nav.tabs button b { font-size: 21px; font-weight: 400; line-height: 1.1; }
  nav.tabs button.on { color: var(--accent); }

  #full { position: fixed; inset: 0; background: linear-gradient(#26161c, var(--bg) 60%); z-index: 20; display: none;
          flex-direction: column; padding: calc(var(--st) + 10px) 26px calc(var(--sb) + 24px); max-width: 820px; margin: 0 auto; }
  #full.show { display: flex; }
  #full .close { align-self: center; background: none; font-size: 26px; color: var(--dim); }
  #full .big { width: 100%; max-width: 420px; aspect-ratio: 1; border-radius: 14px; object-fit: cover; background: var(--panel2); margin: 14px auto 24px; display: block; box-shadow: 0 20px 50px #0008; }
  #full .info { display: flex; align-items: center; gap: 8px; }
  #full .info div { flex: 1; min-width: 0; }
  #full .info .t { font-size: 21px; font-weight: 700; }
  #full .info .s { font-size: 16px; }
  .seek { display: flex; flex-direction: column; margin-top: 18px; }
  .seek input { width: 100%; accent-color: var(--accent); }
  .seek div { display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; }
  .ctrls { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
  .ctrls button { background: none; font-size: 26px; padding: 8px; color: var(--text); }
  .ctrls button.sm { font-size: 20px; color: var(--dim); }
  .ctrls button.sm.on { color: var(--accent); }
  .ctrls #f-play { width: 72px; height: 72px; border-radius: 50%; background: var(--text); color: #000; font-size: 28px; }

  #sheet { position: fixed; inset: 0; background: #0009; z-index: 30; display: none; align-items: flex-end; justify-content: center; }
  #sheet.show { display: flex; }
  #sheet .box { background: var(--panel); width: 100%; max-width: 560px; border-radius: 16px 16px 0 0; padding: 14px 14px calc(var(--sb) + 14px); max-height: 85dvh; display: flex; flex-direction: column; }
  #sheet .ttl { color: var(--dim); font-size: 13px; text-align: center; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sheet .acts { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
  #sheet .acts button { text-align: left; padding: 13px 14px; background: var(--panel2); }
  #sheet .acts button.danger { color: var(--err); }
  #sheet .scroll { overflow-y: auto; flex: 1; margin: 8px 0; }
  #toast { position: fixed; left: 50%; bottom: calc(var(--sb) + 140px); transform: translateX(-50%); background: #fff; color: #000; padding: 10px 16px; border-radius: 99px; font-size: 14px; z-index: 40; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header class="top"><h1 id="title">Songs</h1><span class="chip" id="netchip"></span></header>
<section id="view"></section>
<div id="mini"><img class="art" id="m-art" alt=""><div class="txt"><div class="t" id="m-title"></div><div class="s" id="m-artist"></div></div>
  <button id="m-play" aria-label="Play/Pause">▶</button><button id="m-next" aria-label="Next">⏭</button><i class="line" id="m-line"></i></div>
<nav class="tabs">
  <button data-tab="songs"><b>♫</b>Songs</button>
  <button data-tab="playlists"><b>☰</b>Playlists</button>
  <button data-tab="add"><b>＋</b>Add</button>
  <button data-tab="settings"><b>⚙︎</b>Settings</button>
</nav>

<div id="full">
  <button class="close" id="f-close" aria-label="Close">⌄</button>
  <img class="big" id="f-art" alt="">
  <div class="info"><div><div class="t" id="f-title"></div><div class="s" id="f-artist"></div></div>
    <button class="more" id="f-more" aria-label="More">⋯</button></div>
  <div class="seek"><input type="range" id="f-pos" min="0" max="1000" value="0"><div><span id="f-cur">0:00</span><span id="f-len">0:00</span></div></div>
  <div class="ctrls">
    <button class="sm" id="f-shuf" aria-label="Shuffle">⤨</button>
    <button id="f-prev" aria-label="Previous">⏮</button>
    <button id="f-play" aria-label="Play/Pause">▶</button>
    <button id="f-next" aria-label="Next">⏭</button>
    <button class="sm" id="f-rep" aria-label="Repeat">↻</button>
  </div>
</div>

<div id="sheet"><div class="box"></div></div>
<div id="toast"></div>
<input type="file" id="importfile" accept=".zip,application/zip" multiple hidden>
<audio id="audio" preload="auto" playsinline></audio>

<script>
// Offline Music, phone-only edition: everything lives on this phone. Songs are downloaded
// in a-Shell (getmusic.py) into a .zip in Files, and the Import button copies them in here.
const $ = s => document.querySelector(s);
const audio = $('#audio');
const LS = { get: (k, d) => { try { const v = localStorage.getItem('om.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
             set: (k, v) => { try { localStorage.setItem('om.' + k, JSON.stringify(v)); } catch (e) { toast('Phone storage is full'); } } };
const SONGS = 'om-songs';
const BASE = new URL('./', location.href.split('#')[0].split('?')[0]).href;
const media = f => BASE + 'media/' + encodeURIComponent(f);
const fmt = s => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mb = b => b > 1e9 ? (b / 1e9).toFixed(1) + ' GB' : Math.round(b / 1e6) + ' MB';
const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const shortcutName = () => LS.get('shortcut', 'Get Music');

// ---------------- state
let library = LS.get('library', []);
let playlists = LS.get('playlists', []);
let saved = new Set();          // ids of songs whose audio is really in storage
let tab = LS.get('tab', 'songs'), openPl = null, filter = '', sortBy = LS.get('sort', 'added');
let importing = null;           // {name, done, total}
let queue = [], qi = -1, shuffle = false, repeat = 'off';
const byId = id => library.find(t => t.id === id);
const livePlaylists = () => playlists.filter(p => !p.deleted);
const canPlay = t => saved.has(t.id);
const saveLib = () => LS.set('library', library);

async function refreshSaved() {
  if (!('caches' in window)) return;
  const cache = await caches.open(SONGS);
  const keys = new Set((await cache.keys()).map(r => r.url));
  saved = new Set(library.filter(t => keys.has(media(t.file))).map(t => t.id));
}

// ---------------- reading the .zip from a-Shell (or from the Mac's export)
async function readZip(file) {
  const u16 = (v, o) => v.getUint16(o, true), u32 = (v, o) => v.getUint32(o, true), u64 = (v, o) => Number(v.getBigUint64(o, true));
  const tailLen = Math.min(file.size, 65557);
  const tail = new DataView(await file.slice(file.size - tailLen).arrayBuffer());
  let e = -1;
  for (let i = tailLen - 22; i >= 0; i--) if (u32(tail, i) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error('That isn’t a zip file');
  let count = u16(tail, e + 10), cdSize = u32(tail, e + 12), cdOff = u32(tail, e + 16);
  if ((cdOff === 0xffffffff || count === 0xffff) && e >= 20 && u32(tail, e - 20) === 0x07064b50) {   // zip64
    const off = u64(tail, e - 12);
    const z = new DataView(await file.slice(off, off + 56).arrayBuffer());
    count = u64(z, 32); cdSize = u64(z, 40); cdOff = u64(z, 48);
  }
  const cd = new DataView(await file.slice(cdOff, cdOff + cdSize).arrayBuffer());
  const dec = new TextDecoder();
  const entries = new Map();
  for (let p = 0, n = 0; n < count && p + 46 <= cd.byteLength; n++) {
    if (u32(cd, p) !== 0x02014b50) break;
    const method = u16(cd, p + 10), nameLen = u16(cd, p + 28), extraLen = u16(cd, p + 30), commLen = u16(cd, p + 32);
    let csize = u32(cd, p + 20), usize = u32(cd, p + 24), local = u32(cd, p + 42);
    const name = dec.decode(new Uint8Array(cd.buffer, p + 46, nameLen));
    for (let x = p + 46 + nameLen; x + 4 <= p + 46 + nameLen + extraLen;) {   // zip64 sizes/offset
      const id = u16(cd, x), len = u16(cd, x + 2); let y = x + 4;
      if (id === 1) {
        if (usize === 0xffffffff) { usize = u64(cd, y); y += 8; }
        if (csize === 0xffffffff) { csize = u64(cd, y); y += 8; }
        if (local === 0xffffffff) { local = u64(cd, y); }
      }
      x += 4 + len;
    }
    entries.set(name, { method, csize, local });
    p += 46 + nameLen + extraLen + commLen;
  }
  async function blob(name, type) {
    const ent = entries.get(name); if (!ent) return null;
    const lh = new DataView(await file.slice(ent.local, ent.local + 30).arrayBuffer());
    const start = ent.local + 30 + u16(lh, 26) + u16(lh, 28);
    const raw = file.slice(start, start + ent.csize);
    if (ent.method === 0) return new Blob([raw], { type });
    if (ent.method === 8 && 'DecompressionStream' in window)
      return new Blob([await new Response(raw.stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()], { type });
    throw new Error('Unsupported zip compression');
  }
  return { entries, blob };
}
const typeOf = f => /\.m4a$|\.mp4$/i.test(f) ? 'audio/mp4' : /\.webm$/i.test(f) ? 'audio/webm' : /\.opus$/i.test(f) ? 'audio/ogg'
  : /\.mp3$/i.test(f) ? 'audio/mpeg' : /\.webp$/i.test(f) ? 'image/webp' : /\.png$/i.test(f) ? 'image/png' : 'image/jpeg';

async function importFiles(files) {
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  const cache = await caches.open(SONGS);
  let added = 0, plNames = [], problems = [];
  for (const file of files) {
    importing = { name: file.name, done: 0, total: 0 }; renderImport();
    try {
      const zip = await readZip(file);
      const mBlob = await zip.blob('offline-music.json', 'application/json');
      if (!mBlob) throw new Error('not a download from getmusic');
      const man = JSON.parse(await mBlob.text());
      importing.total = man.tracks.length; renderImport();
      for (const t of man.tracks) {
        try {
          const a = await zip.blob(t.file, typeOf(t.file));
          if (!a) throw new Error('missing audio');
          await cache.put(media(t.file), new Response(a, { headers: { 'Content-Type': a.type, 'Content-Length': String(a.size) } }));
          let cover = null;
          if (t.cover) { const c = await zip.blob(t.cover, typeOf(t.cover)); if (c) { await cache.put(media(t.cover), new Response(c, { headers: { 'Content-Type': c.type } })); cover = t.cover; } }
          const track = { id: String(t.id), title: t.title || 'Untitled', artist: t.artist || 'Unknown artist', album: t.album || '',
                          duration: t.duration || 0, file: t.file, cover, size: a.size, added: t.added || Math.floor(Date.now() / 1000) };
          library = library.filter(x => x.id !== track.id); library.push(track); saved.add(track.id); added++;
        } catch (err) { problems.push(t.title + ': ' + err.message); }
        importing.done++; if (importing.done % 3 === 0) { saveLib(); renderImport(); }
      }
      saveLib();
      for (const p of man.playlists || []) {   // a YouTube playlist's latest order replaces the old copy
        const mine = playlists.find(x => x.id === p.id);
        const clean = { name: String(p.name || 'Playlist').slice(0, 120), tracks: (p.tracks || []).map(String), updated: Date.now(), deleted: false };
        if (mine) Object.assign(mine, clean); else playlists.push({ id: String(p.id || uid()), ...clean });
        plNames.push(clean.name);
      }
      LS.set('playlists', playlists);
    } catch (err) { problems.push(file.name + ': ' + (err.name === 'QuotaExceededError' ? 'phone storage is full' : err.message)); }
  }
  importing = null;
  await refreshSaved(); render(); renderNet();
  const msg = `Imported ${added} song${added === 1 ? '' : 's'}` + (plNames.length ? ` · playlist “${plNames.join('”, “')}”` : '');
  toast(problems.length ? msg + ` · ${problems.length} problem${problems.length > 1 ? 's' : ''}` : msg);
  if (problems.length) console.warn(problems);
  lastImport = { msg, problems, files: [...files].map(f => f.name) };
  if (tab === 'add') render();
}
let lastImport = null;
function renderImport() {
  renderNet();
  const box = $('#importbox'); if (!box) return;
  box.innerHTML = importBoxHtml();
}
function importBoxHtml() {
  if (importing) {
    const pct = importing.total ? importing.done / importing.total * 100 : 0;
    return `<div class="job"><div class="t">Importing ${esc(importing.name)}</div>
      <div class="s">${importing.total ? `${importing.done} of ${importing.total} songs` : 'Opening…'} — keep the app open</div>
      <div class="prog"><i style="width:${pct}%"></i></div></div>`;
  }
  if (lastImport) return `<div class="job"><div class="t">✅ ${esc(lastImport.msg)}</div>
    ${lastImport.problems.map(p => `<div class="s" style="color:var(--err)">${esc(p)}</div>`).join('')}
    <div class="s">You can now delete ${lastImport.files.length > 1 ? 'those files' : '<b>' + esc(lastImport.files[0]) + '</b>'} from Files → a-Shell → Music Inbox to free space.</div></div>`;
  return '';
}

// ---------------- playlists
function savePl() { LS.set('playlists', playlists); render(); }
function newPlaylist(name, tracks = []) {
  const p = { id: uid(), name, tracks, updated: Date.now(), deleted: false };
  playlists.push(p); savePl(); return p;
}
const livePl = p => playlists.find(x => x.id === p.id) || p;
function editPl(p, changes) { Object.assign(livePl(p), changes, { updated: Date.now() }); savePl(); }
function addToPl(p, ids) {
  p = livePl(p);
  const add = ids.filter(id => !p.tracks.includes(id));
  editPl(p, { tracks: p.tracks.concat(add) });
  toast(add.length ? `Added ${add.length === 1 ? 'to' : add.length + ' songs to'} “${p.name}”` : 'Already in that playlist');
}
const plTracks = p => p.tracks.map(byId).filter(Boolean);
const plCover = p => plTracks(p).find(t => t.cover)?.cover;

async function deleteTrack(t) {
  const cache = await caches.open(SONGS);
  await cache.delete(media(t.file)); if (t.cover) await cache.delete(media(t.cover));
  library = library.filter(x => x.id !== t.id); saved.delete(t.id); saveLib();
}

// ---------------- UI helpers
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
function closeSheet() { $('#sheet').classList.remove('show'); }
$('#sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };
function sheet(title, actions) {
  const box = $('#sheet .box');
  box.innerHTML = `<div class="ttl">${esc(title)}</div><div class="acts">${actions.map((a, i) =>
    `<button data-i="${i}" class="${a.danger ? 'danger' : ''}">${esc(a.label)}</button>`).join('')}
    <button data-i="-1" style="text-align:center;margin-top:4px">Cancel</button></div>`;
  box.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { closeSheet(); const a = actions[+b.dataset.i]; a && a.fn(); });
  $('#sheet').classList.add('show');
}
function askText(title, value = '', okLabel = 'Save') {
  return new Promise(resolve => {
    const box = $('#sheet .box');

$('#f-more').onclick = () => { const t = queue[qi]; if (t) songMenu(t); };
audio.onended = () => { if (audio.src !== silent) next(true); };
audio.onplay = () => { if (audio.src !== silent) $('#m-play').textContent = $('#f-play').textContent = '⏸'; };
audio.onpause = () => { $('#m-play').textContent = $('#f-play').textContent = '▶'; };
let seeking = false;
audio.ontimeupdate = () => {
  if (audio.src === silent) return;
  const d = audio.duration || 0;
  $('#f-cur').textContent = fmt(audio.currentTime); $('#f-len').textContent = fmt(d);
  $('#m-line').style.width = d ? (audio.currentTime / d * 100) + '%' : 0;
  if (!seeking && d) $('#f-pos').value = audio.currentTime / d * 1000;
  if ('mediaSession' in navigator && navigator.mediaSession.setPositionState && d && isFinite(d))
    try { navigator.mediaSession.setPositionState({ duration: d, position: Math.min(audio.currentTime, d), playbackRate: 1 }); } catch {}
};
$('#f-pos').oninput = () => { seeking = true; $('#f-cur').textContent = fmt($('#f-pos').value / 1000 * (audio.duration || 0)); };
$('#f-pos').onchange = () => { if (audio.duration) audio.currentTime = $('#f-pos').value / 1000 * audio.duration; seeking = false; };
if ('mediaSession' in navigator) {
  const ms = navigator.mediaSession, h = (a, f) => { try { ms.setActionHandler(a, f); } catch {} };
  h('play', () => audio.play()); h('pause', () => audio.pause());
  h('nexttrack', () => next(false)); h('previoustrack', prev);
  h('seekto', d => { audio.currentTime = d.seekTime; });
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight') audio.currentTime += 10;
  else if (e.key === 'ArrowLeft') audio.currentTime -= 10;
  else if (e.key === 'Escape') { $('#full').classList.remove('show'); closeSheet(); }
});

// ---------------- start
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render(); renderNet();
refreshSaved().then(render);
</script>
